name: Firmware and regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence-collector:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and smoke-test Windows evidence collector without a Wi-Fi adapter
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            "$pwd/tools/Collect-WifiEvidence.ps1", [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          $evidenceRoot = Join-Path $env:RUNNER_TEMP 'wifi-evidence'
          ./tools/Collect-WifiEvidence.ps1 -Scenario ci-smoke -Seconds 30 -OutputRoot $evidenceRoot
          $folder = Get-ChildItem $evidenceRoot -Directory | Select-Object -First 1
          $manifest = Get-Content (Join-Path $folder.FullName 'manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.scenario -ne 'ci-smoke') { throw 'Missing scenario metadata' }
          $samples = @(Get-Content (Join-Path $folder.FullName 'samples.jsonl') | ForEach-Object { $_ | ConvertFrom-Json })
          if ($samples.Count -lt 1 -or -not $samples[0].utc) { throw 'Missing timestamped samples' }
          if (-not (Test-Path (Join-Path $folder.FullName 'ended-utc.txt'))) { throw 'Missing completion timestamp' }
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Parsers, lifecycle, HTTP and UI
        run: python tests/run_tests.py --sanitize
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Build ESP32-WROOM-32 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py -B build-modern -DIDF_TARGET=esp32 build
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-wroom32-firmware
          path: |
            build-modern/esp32-wifi-penetration-tool.bin
            build-modern/bootloader/bootloader.bin
            build-modern/partition_table/partition-table.bin
            build-modern/flash_args
            build-modern/flasher_args.json
